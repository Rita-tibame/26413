        .card-hover:hover {

                    mainTitle: '栗子饅頭的大人商業提案', subTitle: '哈～數據變現、B2B 導流、社群話題，慢慢品味就懂了', headerIcon: 'fa-briefcase',
                    c1Title: '1. 用戶 LTV 與核心受眾', c1Desc: '募資亮點：找出最容易轉換的高淨值客群。', c1Insight: '商業價值：45% 是有消費力的 1-3 年飼主，是訂閱制和高單價導購的黃金客群。（啜一口）哈～這塊值得好好經營。',
                    c2Title: '2. 品牌導購潛力 & PR 行銷', c2Desc: '社群話題：利用知識落差建立社群共鳴。', c2Insight: 'PR 操作：「7成貓奴誤解飲食」是很好的話題。B2B 可以向食品品牌提案贊助模組。哈～好生意要沉得住氣。', c2Tag: '💰 前輩的 B2B 門路', c2Center: '導購紅利',
                    c3Title: '3. 獸醫院 B2B 導流價值', c3Desc: '提案痛點：48% 飼主會猶豫不決而延誤就醫。', c3Insight: 'B2B 提案：App 警示功能能把猶豫的病患提早 12 小時導流到診所，院所來客增加、糾紛也減少。哈～這杯敬合作夥伴。',
                    c4Title: '4. 產品變現漏斗 (Monetization)', c4Desc: '商業模式：由淺入深打造付費護城河。', c4Insight: '變現策略：用免費「檢核清單」引流拉新，再把進階「AI 對話問答」包裝成高毛利訂閱。先讓人嚐到甜頭，哈～這就是大人的做法。'
                },
                character: {
                    name: '栗子饅頭', emoji: '🌰', role: '商業公關・懂享受的大人前輩',
                    lines: ['哈～', '（啜一口）…這數據，有點東西。', '好的生意跟好的下酒菜一樣，要慢慢品。', '年輕人，別急。先算清楚再出手。']
                },
                charts: {
                    pieColors: ['#64748b', '#facc15', '#10b981'],
                    donutColors: ['#3b82f6', '#facc15', '#64748b'],
                    barColors: ['#3b82f6', '#facc15', '#ef4444', '#991b1b'],
                    radarColors: ['#a855f7', '#facc15']
                }
            }
        };

        let chartInstances = {};
        let currentTheme = 'internal';
        let lineIndex = 0;

        // 點角色對話框時，輪播下一句台詞
        function nextLine() {
            const lines = THEMES[currentTheme].character.lines;
            lineIndex = (lineIndex + 1) % lines.length;
            document.getElementById('mascot-line').textContent = `「${lines[lineIndex]}」`;
        }

        function renderCharts(themeKey) {
            const data = THEMES[themeKey].charts;
            const colors = THEMES[themeKey].colors;
            
            // 全局字體顏色設定
            Chart.defaults.color = colors.chartText;
            Chart.defaults.font.family = "'Nunito', 'Noto Sans TC', sans-serif";
            const gridConfig = { color: colors.chartGrid, drawBorder: false, borderDash: [5, 5] };

            // 銷毀舊圖表
            Object.keys(chartInstances).forEach(key => {
                if (chartInstances[key]) chartInstances[key].destroy();
            });

            // 圖表 1: 圓餅圖
            chartInstances['c1'] = new Chart(document.getElementById('chart1').getContext('2d'), {
                type: 'pie',
                data: {
                    labels: ['完全新手 (<1年)', '半熟飼主 (1-3年)', '資深貓奴 (>3年)'],
                    datasets: [{
                        data: [20, 45, 35],
                        backgroundColor: data.pieColors, borderWidth: 0, hoverOffset: 8
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });

            // 圖表 2: 甜甜圈圖
            chartInstances['c2'] = new Chart(document.getElementById('chart2').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: ['認為符合=安心', '知道僅是底線', '不清楚標準'],
                    datasets: [{
                        data: [70, 20, 10],
                        backgroundColor: data.donutColors, borderWidth: 0, cutout: '70%'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });

            // 圖表 3: 交叉分析長條圖 (年資 vs. 就醫決策)
            chartInstances['c3'] = new Chart(document.getElementById('chart3').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['半天內就醫', '觀察24小時', '觀察2-3天', '嚴重才去'],
                    datasets: [
                        { label: '新手 (<1年)', data: [60, 30, 10, 0], backgroundColor: data.barColors[0], borderRadius: 4 },
                        { label: '半熟 (1-3年)', data: [20, 50, 25, 5], backgroundColor: data.barColors[1], borderRadius: 4 },
                        { label: '資深 (>3年)', data: [5, 20, 60, 15], backgroundColor: data.barColors[2], borderRadius: 4 }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: {size: 11} } } },
                    scales: { 
                        y: { beginAtZero: true, max: 70, grid: gridConfig, title: {display: true, text: '佔該年資比例(%)', font: {size: 10}} }, 
                        x: { grid: {display: false} } 
                    }
                }
            });

            // 圖表 4: 雙柱狀圖 (代替雷達圖更易讀)
            chartInstances['c4'] = new Chart(document.getElementById('chart4').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['新手', '半熟飼主', '資深貓奴'],
                    datasets: [
                        { label: '偏好 檢核清單', data: [85, 45, 30], backgroundColor: data.radarColors[0], borderRadius: 4 },
                        { label: '偏好 對話問答', data: [15, 55, 70], backgroundColor: data.radarColors[1], borderRadius: 4 }
                    ]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 100, grid: gridConfig }, x: { grid: {display: false} } }
                }
            });
        }

        function setTheme(themeKey) {
            const theme = THEMES[themeKey];
            const c = theme.colors;
            const t = theme.content;

            // 1. 更新按鈕狀態
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = `tab-btn px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all ${c.btnInactive}`;
            });
            const activeBtn = document.getElementById(`btn-${themeKey}`);
            activeBtn.className = `tab-btn px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all shadow-md transform scale-105 ${c.btnActiveBg} ${c.btnActiveText}`;

            // 2. 更新背景與全域文字顏色
            const body = document.getElementById('app-body');
            body.className = `antialiased min-h-screen pb-12 font-[Nunito,'Noto_Sans_TC',sans-serif] ${c.bodyBg} ${c.bodyText}`;

            // 3. 更新頭部區域
            document.getElementById('app-header').className = `shadow-sm sticky top-0 z-50 rounded-b-3xl mb-8 border-b-4 theme-transition backdrop-blur-md bg-opacity-90 ${c.headerBg} ${c.headerBorder}`;
            document.getElementById('header-icon-box').className = `p-3 rounded-full theme-transition flex items-center justify-center w-12 h-12 ${c.headerIconBg}`;
            document.getElementById('header-icon').className = `fa-solid ${t.headerIcon} text-xl theme-transition ${c.headerIconText}`;
            document.getElementById('main-title').textContent = t.mainTitle;
            document.getElementById('sub-title').textContent = t.subTitle;
            document.getElementById('sub-title').className = `text-sm font-semibold theme-transition mt-0.5 ${['internal', 'business'].includes(themeKey) ? 'text-slate-400' : 'text-gray-500'}`;

            // 4. 更新卡片背景與邊框
            document.querySelectorAll('.ui-card').forEach(card => {
                card.className = `ui-card rounded-3xl p-6 shadow-md card-hover border theme-transition flex flex-col ${c.cardBg} ${c.cardBorder}`;
            });

            // 5. 更新卡片 1 內容
            document.querySelector('.card-icon-1').className = `card-icon-1 w-10 h-10 rounded-xl flex items-center justify-center text-lg theme-transition ${c.c1IconBg} ${c.c1IconText}`;
            document.getElementById('card1-title').textContent = t.c1Title;
            document.getElementById('card1-desc').textContent = t.c1Desc;
            document.getElementById('card1-insight').textContent = t.c1Insight;
            document.querySelector('.insight-box-1').className = `insight-box-1 mt-6 border-l-4 p-4 rounded-r-xl theme-transition ${c.c1BoxBg} ${c.c1BoxBorder} ${c.c1BoxText}`;

            // 6. 更新卡片 2 內容
            document.querySelector('.card-icon-2').className = `card-icon-2 w-10 h-10 rounded-xl flex items-center justify-center text-lg theme-transition ${c.c2IconBg} ${c.c2IconText}`;
            document.getElementById('card2-title').textContent = t.c2Title;
            document.getElementById('card2-desc').textContent = t.c2Desc;
            document.getElementById('card2-insight').textContent = t.c2Insight;
            document.querySelector('.insight-box-2').className = `insight-box-2 mt-6 border-l-4 p-4 rounded-r-xl theme-transition ${c.c2BoxBg} ${c.c2BoxBorder} ${c.c2BoxText}`;
            
            document.getElementById('card2-tag').className = `absolute top-6 right-6 text-xs font-bold px-3 py-1.5 rounded-full border flex items-center gap-1 shadow-sm theme-transition ${c.c2TagBg} ${c.c2TagBorder} ${c.c2TagText}`;
            document.getElementById('card2-tag-text').textContent = t.c2Tag;
            
            document.getElementById('donut-center-val').className = `text-3xl font-black theme-transition ${c.c2IconText}`;
            document.getElementById('donut-center-text').textContent = t.c2Center;

            // 7. 更新卡片 3 內容
            document.querySelector('.card-icon-3').className = `card-icon-3 w-10 h-10 rounded-xl flex items-center justify-center text-lg theme-transition ${c.c3IconBg} ${c.c3IconText}`;
            document.getElementById('card3-title').textContent = t.c3Title;
            document.getElementById('card3-desc').textContent = t.c3Desc;
            document.getElementById('card3-insight').textContent = t.c3Insight;
            document.querySelector('.insight-box-3').className = `insight-box-3 mt-6 border-l-4 p-4 rounded-r-xl theme-transition ${c.c3BoxBg} ${c.c3BoxBorder} ${c.c3BoxText}`;

            // 8. 更新卡片 4 內容
            document.querySelector('.card-icon-4').className = `card-icon-4 w-10 h-10 rounded-xl flex items-center justify-center text-lg theme-transition ${c.c4IconBg} ${c.c4IconText}`;
            document.getElementById('card4-title').textContent = t.c4Title;
            document.getElementById('card4-desc').textContent = t.c4Desc;
            document.getElementById('card4-insight').textContent = t.c4Insight;
            document.querySelector('.insight-box-4').className = `insight-box-4 mt-6 border-l-4 p-4 rounded-r-xl theme-transition ${c.c4BoxBg} ${c.c4BoxBorder} ${c.c4BoxText}`;

            // 9. 更新角色對話框
            const ch = theme.character;
            currentTheme = themeKey; lineIndex = 0;
            document.getElementById('mascot').className = `w-full text-left flex items-center gap-4 p-4 rounded-3xl border-2 shadow-sm theme-transition ${c.c1BoxBg} ${c.c1BoxBorder} ${c.c1BoxText}`;
            document.getElementById('mascot-emoji').textContent = ch.emoji;
            document.getElementById('mascot-name').textContent = `${ch.name}｜${ch.role}`;
            document.getElementById('mascot-line').textContent = `「${ch.lines[0]}」`;

            // 10. 重新渲染圖表顏色
            renderCharts(themeKey);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // 預設載入「內部人員」視角
            setTheme('internal');
        });
    </script>
</body>
</html>
