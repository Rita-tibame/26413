<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>您的專屬 3D 立體貼圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        candy: {
                            pink: '#ffccd5',
                            mint: '#c8f7dc',
                            sky: '#c7e9f5',
                            lavender: '#f3e8ff'
                        }
                    },
                    borderRadius: {
                        '3xl': '2rem',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #f3e8ff 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sticker-card:hover {
            transform: translateY(-10px) rotate(2deg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .sticker-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .btn-gradient {
            background: linear-gradient(to right, #fb7185, #f472b6);
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-8">

    <!-- Hero Section -->
    <header class="max-w-6xl mx-auto text-center py-12 md:py-20">
        <div class="inline-flex items-center space-x-4 mb-8 glass px-6 py-3 rounded-full shadow-sm">
            <div class="w-12 h-12 rounded-full bg-indigo-200 border-2 border-white flex items-center justify-center overflow-hidden">
                <span class="text-xs font-bold text-indigo-900">原圖</span>
            </div>
            <p class="text-sm font-medium text-slate-600">基於您的照片生成</p>
        </div>
        
        <h1 class="text-4xl md:text-6xl font-bold mb-6 tracking-tight text-slate-900">
            您的專屬 <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-indigo-500">3D 立體貼圖</span>
        </h1>
        <p class="text-lg md:text-xl text-slate-600 max-w-2xl mx-auto">
            精心打造的數位收藏品，讓您的日常對話更具生命力與趣味。
        </p>
    </header>

    <!-- Sticker Showcase Grid -->
    <main class="max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- Card 1 -->
            <div class="sticker-card glass p-6 rounded-3xl flex flex-col items-center">
                <img src='https://opal.google/board/blobs/e4858366-ca40-48e5-a4d1-36102bb30746' alt='Sticker 1' class="w-full h-auto mb-6 rounded-2xl shadow-inner"/>
                <div class="flex gap-3 w-full">
                    <button class="flex-1 py-2 rounded-full text-sm font-semibold text-white btn-gradient">下載貼圖</button>
                    <button class="px-4 py-2 rounded-full text-sm font-semibold text-slate-600 bg-white/50 border border-slate-200">分享</button>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="sticker-card glass p-6 rounded-3xl flex flex-col items-center">
                <img src='https://opal.google/board/blobs/e1fd5024-e4db-4322-ad22-d86d2df289af' alt='Sticker 2' class="w-full h-auto mb-6 rounded-2xl shadow-inner"/>
                <div class="flex gap-3 w-full">
                    <button class="flex-1 py-2 rounded-full text-sm font-semibold text-white btn-gradient">下載貼圖</button>
                    <button class="px-4 py-2 rounded-full text-sm font-semibold text-slate-600 bg-white/50 border border-slate-200">分享</button>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="sticker-card glass p-6 rounded-3xl flex flex-col items-center">
                <img src='https://opal.google/board/blobs/9b6527f5-6659-4b86-b403-b3da07de87d4' alt='Sticker 3' class="w-full h-auto mb-6 rounded-2xl shadow-inner"/>
                <div class="flex gap-3 w-full">
                    <button class="flex-1 py-2 rounded-full text-sm font-semibold text-white btn-gradient">下載貼圖</button>
                    <button class="px-4 py-2 rounded-full text-sm font-semibold text-slate-600 bg-white/50 border border-slate-200">分享</button>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="sticker-card glass p-6 rounded-3xl flex flex-col items-center lg:col-start-2">
                <img src='https://opal.google/board/blobs/58a4817d-d569-4735-b766-214ae607bafd' alt='Sticker 4' class="w-full h-auto mb-6 rounded-2xl shadow-inner"/>
                <div class="flex gap-3 w-full">
                    <button class="flex-1 py-2 rounded-full text-sm font-semibold text-white btn-gradient">下載貼圖</button>
                    <button class="px-4 py-2 rounded-full text-sm font-semibold text-slate-600 bg-white/50 border border-slate-200">分享</button>
                </div>
            </div>

            <!-- Card 5 -->
            <div class="sticker-card glass p-6 rounded-3xl flex flex-col items-center">
                <img src='https://opal.google/board/blobs/67aa5eb0-9017-49d1-aa74-e47e45ce870d' alt='Sticker 5' class="w-full h-auto mb-6 rounded-2xl shadow-inner"/>
                <div class="flex gap-3 w-full">
                    <button class="flex-1 py-2 rounded-full text-sm font-semibold text-white btn-gradient">下載貼圖</button>
                    <button class="px-4 py-2 rounded-full text-sm font-semibold text-slate-600 bg-white/50 border border-slate-200">分享</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Action -->
    <div class="max-w-6xl mx-auto text-center py-20">
        <a href="#" class="inline-block px-10 py-4 bg-slate-900 text-white font-bold rounded-full hover:bg-slate-700 transition-all duration-300 shadow-xl">
            重新生成更多貼圖
        </a>
    </div>

</body>
</html>
